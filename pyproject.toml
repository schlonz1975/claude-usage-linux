[project]
name = "claude-usage-linux"
version = "0.1.0"
description = "KDE Plasma widget and Linux tray indicator for Claude usage limits"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Claude Usage Linux contributors" }
]
keywords = ["claude", "anthropic", "kde", "plasma", "linux", "usage"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: X11 Applications :: GTK",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment :: K Desktop Environment (KDE)",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/schlonz1975/codex-usage-linux"
Issues = "https://github.com/schlonz1975/codex-usage-linux/issues"
